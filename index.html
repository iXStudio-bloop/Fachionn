<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fachionn Site</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --glass-bg: rgba(12, 16, 32, 0.55);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-hover: rgba(255, 255, 255, 0.1);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #020617;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 120px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоны и визуальные эффекты */
    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(130px);
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
      animation: pulse 16s infinite alternate ease-in-out;
    }

    .nebula-1 { width: 550px; height: 550px; background: #4f46e5; top: -10%; left: -10%; }
    .nebula-2 { width: 650px; height: 650px; background: #9333ea; bottom: -10%; right: -10%; animation-delay: -8s; }

    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(40px, -20px); }
    }

    .header-brand {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(180deg, #ffffff 20%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.4));
    }

    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 35px 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .album-section {
      text-align: center;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Плашка «Новый Релиз!» над обложкой */
    .release-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      margin-bottom: 16px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid var(--accent);
      border-radius: 20px;
      color: #e9d5ff;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
      transition: all 0.3s ease;
      user-select: none;
    }

    .release-badge:hover {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 25px var(--accent-glow);
      transform: translateY(-2px) scale(1.03);
    }

    .release-badge i {
      font-size: 0.8rem;
    }

    .album-cover {
      width: 210px;
      height: 210px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8),
                  0 0 20px rgba(168, 85, 247, 0.2);
      border: 1px solid var(--glass-border);
      transition: transform 0.4s ease;
      cursor: pointer;
    }

    .album-cover:hover {
      transform: scale(1.04) rotate(1deg);
    }

    .album-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .tracks-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .tracks-list::-webkit-scrollbar {
      width: 6px;
    }
    .tracks-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .track-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      transition: all 0.3s ease;
    }

    .track-item:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateX(4px);
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-grow: 1;
      overflow: hidden;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: scale(1.1);
    }

    .track-name {
      font-weight: 500;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Стили для карточек альбомов/синглов во вкладке Музыка */
    .music-releases-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .music-releases-grid::-webkit-scrollbar {
      width: 6px;
    }
    .music-releases-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .release-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .release-card:hover {
      background: var(--glass-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .release-card-cover {
      width: 85px;
      height: 85px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .release-card-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .release-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .release-card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.2px;
      opacity: 0.8;
    }

    /* Стили для вкладки "О проекте" */
    .links-section-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .links-block {
      margin-bottom: 25px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .social-btn {
      text-decoration: none;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .social-btn i {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    /* Иконки соцсетей и стримингов */
    .social-btn.telegram i { color: #38bdf8; }
    .social-btn.vk i { color: #0077ff; }
    .social-btn.youtube i { color: #ff0000; }
    .social-btn.yandex i { color: #fc3f1d; }
    .social-btn.zvuk i { color: #22c55e; }
    .social-btn.kion i { color: #e11d48; }
    .social-btn.spotify i { color: #1db954; }
    .social-btn.apple i { color: #fa233b; }

    /* Кнопка доната */
    .donate-container {
      margin-top: 30px;
      margin-bottom: 15px;
    }

    .donate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(147, 51, 234, 0.5) 100%);
      border: 1px solid var(--accent);
      border-radius: 18px;
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
    }

    .donate-btn i {
      color: #f43f5e;
      font-size: 1.2rem;
    }

    .donate-btn:hover {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.5) 0%, rgba(147, 51, 234, 0.8) 100%);
      box-shadow: 0 0 35px var(--accent-glow);
      transform: translateY(-3px) scale(1.01);
    }

    .site-author-link {
      display: block;
      margin-top: 35px;
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.7;
      font-style: italic;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .site-author-link:hover {
      opacity: 1;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .bottom-nav {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      background: rgba(10, 14, 28, 0.7);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      padding: 8px;
      border-radius: 22px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 12px 26px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background: var(--glass-hover);
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .player-modal {
      background: rgba(18, 22, 41, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(168, 85, 247, 0.2);
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-overlay.active .player-modal {
      transform: scale(1);
    }

    .close-modal {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .close-modal:hover { color: #fff; }

    .modal-cover {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 20px;
      margin: 10px auto 20px auto;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      border: 1px solid var(--glass-border);
    }

    .modal-track-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-track-artist {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #c084fc);
      width: 0%;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .modal-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn:hover {
      color: var(--accent);
      transform: scale(1.15);
    }

    .modal-btn.play-main {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .modal-btn.play-main:hover {
      transform: scale(1.08);
    }

    @media (max-width: 600px) {
      .brand-title { font-size: 2.8rem; }
      .glass-card { padding: 25px 20px; }
      .bottom-nav { width: 92%; justify-content: space-around; }
      .nav-btn { padding: 10px 14px; font-size: 0.8rem; }
      .links-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>

  <header class="header-brand">
    <h1 class="brand-title">Fachionn</h1>
  </header>

  <main class="main-container">
    <div class="glass-card">

      <!-- Вкладка 1: Главная (Сингл Star Trap) -->
      <section id="main" class="tab-content active">
        <div class="album-section">
          <!-- Надпись «Новый Релиз!» -->
          <div class="release-badge" id="newReleaseBadge">
            <i class="fa-solid fa-compact-disc" aria-hidden="true"></i> Новый Релиз!
          </div>
          
          <img src="album_image.png" alt="Star Trap Cover" class="album-cover" id="mainAlbumCoverImg">
          <div class="album-meta">Star Trap. Single, 2025</div>
        </div>

        <div class="tracks-list" id="mainTracksContainer"></div>
      </section>

      <!-- Вкладка 2: Музыка -->
      <section id="music" class="tab-content">
        <div class="music-releases-grid" id="musicContainer"></div>
      </section>

      <!-- Вкладка 3: О проекте -->
      <section id="about" class="tab-content">
        
        <!-- Страницы проекта -->
        <div class="links-block">
          <div class="links-section-title">Страницы проекта:</div>
          <div class="links-grid">
            <a href="https://t.me/fachionn_music" target="_blank" rel="noopener noreferrer" class="social-btn telegram">
              <i class="fa-brands fa-telegram" aria-hidden="true"></i> Telegram
            </a>
            <a href="https://vk.ru/fachionn" target="_blank" rel="noopener noreferrer" class="social-btn vk">
              <i class="fa-brands fa-vk" aria-hidden="true"></i> ВК
            </a>
            <a href="https://youtube.com/@fachionn_music?si=7KwmKaVoWXnf8INN" target="_blank" rel="noopener noreferrer" class="social-btn youtube">
              <i class="fa-brands fa-youtube" aria-hidden="true"></i> YouTube
            </a>
          </div>
        </div>

        <!-- Стриминговые сервисы -->
        <div class="links-block">
          <div class="links-section-title">Слушать на стриминговых сервисах:</div>
          <div class="links-grid">
            <a href="https://music.yandex.ru/artist/24925583?utm_medium=copy_link&ref_id=736fc09b-742c-42d5-9c2d-d830d96b2b7d" target="_blank" rel="noopener noreferrer" class="social-btn yandex">
              <i class="fa-solid fa-music" aria-hidden="true"></i> Яндекс Музыка
            </a>
            <a href="https://vk.com/artist/3952010487551642017" target="_blank" rel="noopener noreferrer" class="social-btn vk">
              <i class="fa-brands fa-vk" aria-hidden="true"></i> ВК Музыка
            </a>
            <a href="https://zvuk.com/artist/213746774" target="_blank" rel="noopener noreferrer" class="social-btn zvuk">
              <i class="fa-solid fa-wave-square" aria-hidden="true"></i> Звук
            </a>
            <a href="https://mts-music-spo.onelink.me/sKFX?af_js_web=true&af_ss_ver=2_3_0&pid=music_external_widget&c=https://music.mts.ru/artist/24925583&deep_link_value=https://music.mts.ru/artist/24925583&af_ss_ui=true" target="_blank" rel="noopener noreferrer" class="social-btn kion">
              <i class="fa-solid fa-play-circle" aria-hidden="true"></i> КИОН Музыка
            </a>
            <a href="https://open.spotify.com/artist/1tFYtQNUNRlp2smmXTvGPn?si=3lRzyjVxSASP4P1doMTvtA" target="_blank" rel="noopener noreferrer" class="social-btn spotify">
              <i class="fa-brands fa-spotify" aria-hidden="true"></i> Spotify
            </a>
            <a href="https://music.apple.com/ru/artist/fachionn/1851622671" target="_blank" rel="noopener noreferrer" class="social-btn apple">
              <i class="fa-brands fa-apple" aria-hidden="true"></i> Apple Music
            </a>
          </div>
        </div>

        <!-- Кнопка доната -->
        <div class="donate-container">
          <a href="https://tips.yandex.ru/guest/payment/3639534?wl=yandex_music_dark" target="_blank" rel="noopener noreferrer" class="donate-btn">
            <i class="fa-solid fa-heart" aria-hidden="true"></i> Поддержать донатом
          </a>
        </div>

        <a href="https://t.me/vizquacker" target="_blank" rel="noopener noreferrer" class="site-author-link">Site by vizquacker</a>
      </section>

    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-tab="main">Главная</button>
    <button class="nav-btn" data-tab="music">Музыка</button>
    <button class="nav-btn" data-tab="about">О проекте</button>
  </nav>

  <!-- Модальный плеер -->
  <div class="modal-overlay" id="playerModal" role="dialog" aria-modal="true">
    <div class="player-modal">
      <button class="close-modal" id="closeModalBtn" aria-label="Закрыть плеер">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      
      <img src="album_image.png" alt="Cover" class="modal-cover" id="modalCover">
      
      <div class="modal-track-title" id="modalTitle">Track Title</div>
      <div class="modal-track-artist">Fachionn</div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>

      <div class="player-controls">
        <button class="modal-btn" id="prevBtn" aria-label="Предыдущий трек">
          <i class="fa-solid fa-backward-step" aria-hidden="true"></i>
        </button>
        <button class="modal-btn play-main" id="modalPlayBtn" aria-label="Воспроизвести/Пауза">
          <i class="fa-solid fa-play" aria-hidden="true"></i>
        </button>
        <button class="modal-btn" id="nextBtn" aria-label="Следующий трек">
          <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <audio id="globalAudio"></audio>

  <script>
    (() => {
      'use strict';

      const FALLBACK_COVER = 'https://via.placeholder.com/220/0d1117/a855f7?text=Fachionn';

      // Трек для главной страницы
      const mainTrackFiles = [
        {
          title: "Star Trap",
          file: "Star Trap - Fachionn.mp3",
          cover: "album_image.png"
        }
      ];

      // Треки для вкладки "Музыка"
      const musicTracks = [
        {
          title: "Starry Night (New Version)",
          file: "Fachionn - Starry Night (New Version).mp3",
          cover: "Starry Night.jpg",
          type: "Single, 2025"
        },
        {
          title: "Eyes of the Beast",
          file: "Fachionn - Eyes of the Beast.mp3",
          cover: "Eyes of the Beast.jpg",
          type: "Single, 2025"
        },
        {
          title: "Fairy Tale",
          file: "Fachionn - Fairy Tale.mp3",
          cover: "Fairy Tale.jpg",
          type: "Single, 2025"
        },
        {
          title: "Hands Sky",
          file: "Fachionn - Hands Sky.mp3",
          cover: "Hands Sky.jpg",
          type: "Single, 2025"
        },
        {
          title: "Don't Quite",
          file: "Fachionn - Don t Quite.mp3",
          cover: "Don't Quite.jpg",
          type: "Single, 2025"
        },
        {
          title: "Pure Thoughts",
          file: "Fachionn - Pure Thoughts.mp3",
          cover: "Pure Thoughts.jpg",
          type: "Single, 2025"
        }
      ];

      const DOM = {
        mainTracksContainer: document.getElementById('mainTracksContainer'),
        musicContainer: document.getElementById('musicContainer'),
        globalAudio: document.getElementById('globalAudio'),
        playerModal: document.getElementById('playerModal'),
        closeModalBtn: document.getElementById('closeModalBtn'),
        modalTitle: document.getElementById('modalTitle'),
        modalPlayBtn: document.getElementById('modalPlayBtn'),
        progressBar: document.getElementById('progressBar'),
        progressContainer: document.getElementById('progressContainer'),
        currentTimeEl: document.getElementById('currentTime'),
        durationTimeEl: document.getElementById('durationTime'),
        bottomNav: document.getElementById('bottomNav'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        mainAlbumCoverImg: document.getElementById('mainAlbumCoverImg'),
        modalCover: document.getElementById('modalCover'),
        newReleaseBadge: document.getElementById('newReleaseBadge')
      };

      let activePlaylist = [];
      let currentTrackIndex = -1;

      // Обработка ошибок загрузки обложек
      [DOM.mainAlbumCoverImg, DOM.modalCover].forEach(img => {
        if (img) img.addEventListener('error', () => { img.src = FALLBACK_COVER; });
      });

      function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
      }

      // Отрисовка списка главного трека
      function renderMainTrack() {
        const fragment = document.createDocumentFragment();

        mainTrackFiles.forEach((itemData, index) => {
          const item = document.createElement('div');
          item.className = 'track-item';

          const infoDiv = document.createElement('div');
          infoDiv.className = 'track-info';

          const btn = document.createElement('button');
          btn.className = 'play-btn';
          btn.setAttribute('aria-label', `Воспроизвести ${itemData.title}`);
          btn.dataset.index = index;
          btn.innerHTML = '<i class="fa-solid fa-play" aria-hidden="true"></i>';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'track-name';
          nameSpan.textContent = itemData.title;

          infoDiv.appendChild(btn);
          infoDiv.appendChild(nameSpan);
          item.appendChild(infoDiv);
          fragment.appendChild(item);
        });

        DOM.mainTracksContainer.replaceChildren(fragment);
      }

      // Отрисовка релизов на вкладке "Музыка"
      function renderMusicTab() {
        const fragment = document.createDocumentFragment();

        musicTracks.forEach((track, index) => {
          const card = document.createElement('div');
          card.className = 'release-card';
          card.dataset.index = index;

          const img = document.createElement('img');
          img.src = track.cover;
          img.alt = track.title;
          img.className = 'release-card-cover';
          img.addEventListener('error', () => { img.src = FALLBACK_COVER; });

          const details = document.createElement('div');
          details.className = 'release-card-details';

          const title = document.createElement('div');
          title.className = 'release-card-title';
          title.textContent = track.title;

          const meta = document.createElement('div');
          meta.className = 'release-card-meta';
          meta.textContent = track.type;

          details.appendChild(title);
          details.appendChild(meta);

          card.appendChild(img);
          card.appendChild(details);

          fragment.appendChild(card);
        });

        DOM.musicContainer.replaceChildren(fragment);
      }

      function updatePlayIcons(isPlaying) {
        DOM.modalPlayBtn.innerHTML = isPlaying 
          ? '<i class="fa-solid fa-pause" aria-hidden="true"></i>' 
          : '<i class="fa-solid fa-play" aria-hidden="true"></i>';
      }

      function openAndPlay(playlist, index) {
        if (index < 0 || index >= playlist.length) return;

        activePlaylist = playlist;

        if (currentTrackIndex !== index || DOM.globalAudio.src.indexOf(encodeURIComponent(playlist[index].file)) === -1) {
          currentTrackIndex = index;
          const track = playlist[index];
          DOM.modalTitle.textContent = track.title;
          DOM.modalCover.src = track.cover;
          DOM.globalAudio.src = `Tracks/${encodeURIComponent(track.file)}`;
          DOM.globalAudio.play().catch(err => console.error("Ошибка воспроизведения:", err));
        } else if (DOM.globalAudio.paused) {
          DOM.globalAudio.play().catch(err => console.error("Ошибка воспроизведения:", err));
        }

        DOM.playerModal.classList.add('active');
        updatePlayIcons(true);
      }

      function togglePlay() {
        if (DOM.globalAudio.paused) {
          DOM.globalAudio.play().catch(err => console.error("Ошибка воспроизведения:", err));
          updatePlayIcons(true);
        } else {
          DOM.globalAudio.pause();
          updatePlayIcons(false);
        }
      }

      function playNext() {
        if (!activePlaylist.length) return;
        const nextIndex = (currentTrackIndex + 1) % activePlaylist.length;
        openAndPlay(activePlaylist, nextIndex);
      }

      function playPrev() {
        if (!activePlaylist.length) return;
        const prevIndex = (currentTrackIndex - 1 + activePlaylist.length) % activePlaylist.length;
        openAndPlay(activePlaylist, prevIndex);
      }

      // Открытие плеера с главной
      if (DOM.newReleaseBadge) {
        DOM.newReleaseBadge.addEventListener('click', () => openAndPlay(mainTrackFiles, 0));
      }
      if (DOM.mainAlbumCoverImg) {
        DOM.mainAlbumCoverImg.addEventListener('click', () => openAndPlay(mainTrackFiles, 0));
      }

      // Делегирование событий главной страницы
      DOM.mainTracksContainer.addEventListener('click', (e) => {
        const playBtn = e.target.closest('.play-btn');
        if (playBtn) {
          const index = parseInt(playBtn.dataset.index, 10);
          openAndPlay(mainTrackFiles, index);
        }
      });

      // Клик по карточке релиза на вкладке "Музыка"
      DOM.musicContainer.addEventListener('click', (e) => {
        const card = e.target.closest('.release-card');
        if (card) {
          const index = parseInt(card.dataset.index, 10);
          openAndPlay(musicTracks, index);
        }
      });

      // Навигация
      DOM.bottomNav.addEventListener('click', (e) => {
        const btn = e.target.closest('.nav-btn');
        if (!btn) return;

        const targetTab = btn.dataset.tab;
        
        document.querySelectorAll('.tab-content').forEach(tab => {
          tab.classList.toggle('active', tab.id === targetTab);
        });

        document.querySelectorAll('.nav-btn').forEach(navBtn => {
          navBtn.classList.toggle('active', navBtn === btn);
        });
      });

      DOM.closeModalBtn.addEventListener('click', () => {
        DOM.playerModal.classList.remove('active');
      });

      DOM.modalPlayBtn.addEventListener('click', togglePlay);
      DOM.nextBtn.addEventListener('click', playNext);
      DOM.prevBtn.addEventListener('click', playPrev);

      DOM.progressContainer.addEventListener('click', (e) => {
        const width = DOM.progressContainer.clientWidth;
        const clickX = e.offsetX;
        const duration = DOM.globalAudio.duration;
        if (duration) {
          DOM.globalAudio.currentTime = (clickX / width) * duration;
        }
      });

      DOM.globalAudio.addEventListener('timeupdate', () => {
        if (DOM.globalAudio.duration) {
          const progressPercent = (DOM.globalAudio.currentTime / DOM.globalAudio.duration) * 100;
          DOM.progressBar.style.width = `${progressPercent}%`;
          DOM.currentTimeEl.textContent = formatTime(DOM.globalAudio.currentTime);
          DOM.durationTimeEl.textContent = formatTime(DOM.globalAudio.duration);
        }
      });

      DOM.globalAudio.addEventListener('ended', playNext);

      // Инициализация списков треков
      renderMainTrack();
      renderMusicTab();

      // Анимация звездного неба (Canvas)
      function initSpaceAnimation() {
        const canvas = document.getElementById('space-bg');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 150;

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }

        function createStars() {
          stars = Array.from({ length: numStars }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 1.5 + 0.2,
            alpha: Math.random()
          }));
        }

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ffffff';
          stars.forEach(star => {
            ctx.globalAlpha = star.alpha;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fill();
          });
          requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
          resize();
          createStars();
        });

        resize();
        createStars();
        draw();
      }

      initSpaceAnimation();
    })();
  </script>
</body>
</html>
